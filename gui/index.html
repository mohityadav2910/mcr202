<!DOCTYPE html>
<html lang=en>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1.0>
  <title>Cp vs T Database Platform - 200 Engineering Materials</title>
  <link rel=stylesheet href=styles.css>
  <script src=chart.umd.min.js></script>
  <script src=analysis.js></script>
</head>
<body>

  <header>
    <h1>Interactive Specific Heat Capacity (Cp vs. T) Platform</h1>
    <p>Thermodynamic Database & Comparative Analysis for 200 Engineering Materials | NIST Shomate Formulation</p>
  </header>

  <div class=main-container>
    <!-- Left Sidebar: Controls -->
    <div class=sidebar>
      <div class=form-group>
        <label for=categorySelect>Material Category:</label>
        <select id=categorySelect></select>
      </div>

      <div class=form-group>
        <label for=searchInput>Search Material / Formula:</label>
        <input type=text id=searchInput placeholder=e.g. Copper, Al, SiC, Fe...>
      </div>

      <div class=form-group>
        <div style=display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;>
          <label style=margin-bottom: 0;>Select Materials to Compare:</label>
          <button id=clearBtn class=btn btn-secondary style=padding: 2px 6px; font-size: 11px;>Clear All</button>
        </div>
        <div id=materialList class=material-list></div>
      </div>

      <hr style=border: none; border-top: 1px solid #e1e4e8; margin: 15px 0;>

      <div class=form-group>
        <label>Temperature Range (Kelvin):</label>
        <div style=display: flex; gap: 8px;>
          <div>
            <span style=font-size: 11px; color: #586069;>T min (K)</span>
            <input type=number id=tMinInput value=298 min=50 max=3000 step=10>
          </div>
          <div>
            <span style=font-size: 11px; color: #586069;>T max (K)</span>
            <input type=number id=tMaxInput value=1200 min=100 max=4000 step=10>
          </div>
          <div>
            <span style=font-size: 11px; color: #586069;>Step (K)</span>
            <input type=number id=tStepInput value=10 min=1 max=50 step=1>
          </div>
        </div>
      </div>

      <div class=form-group>
        <label>Specific Heat Capacity Unit:</label>
        <div style=font-size: 13px; display: flex; gap: 15px;>
          <label style=font-weight: normal; cursor: pointer;>
            <input type=radio name=unit value=molar checked> J/(mol·K)
          </label>
          <label style=font-weight: normal; cursor: pointer;>
            <input type=radio name=unit value=specific> J/(kg·K)
          </label>
        </div>
      </div>

      <hr style=border: none; border-top: 1px solid #e1e4e8; margin: 15px 0;>

      <div class=form-group>
        <label>Export Tools:</label>
        <div style=display: flex; gap: 8px;>
          <button id=exportCsvBtn class=btn btn-secondary style=flex: 1;>Export CSV</button>
          <button id=exportPngBtn class=btn btn-secondary style=flex: 1;>Export PNG</button>
        </div>
      </div>
    </div>

    <!-- Main Content Area: Plot and Analysis Tables -->
    <div class=content-area>
      <div id=warningBox class=warning-box></div>

      <div class=card>
        <canvas id=cpChart style=max-height: 440px; width: 100%;></canvas>
      </div>

    </div>
  </div>

  <script src=app.js></script>
</body>
</html>
